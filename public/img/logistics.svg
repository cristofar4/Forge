<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="80%"><stop offset="0%" stop-color="#13202e"/><stop offset="55%" stop-color="#0a0e15"/><stop offset="100%" stop-color="#05070a"/></radialGradient>
    <linearGradient id="st" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eaf1f8"/><stop offset="100%" stop-color="#9fb1c6"/></linearGradient>
    <linearGradient id="dk" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1b2433"/><stop offset="100%" stop-color="#0d121b"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c79a5b"/><stop offset="100%" stop-color="#9c7942"/></linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g stroke="#28d7fb" stroke-opacity="0.07" stroke-width="1"><path d="M0 150H800M0 300H800M0 450H800M160 0V600M320 0V600M480 0V600M640 0V600"/></g>
  <ellipse cx="400" cy="500" rx="220" ry="26" fill="#28d7fb" opacity="0.16" filter="url(#gl)"/>
  <g>
    <!-- stacked cargo -->
    <rect x="320" y="250" width="150" height="120" rx="8" fill="url(#box)"/>
    <path d="M320 250 h150 M395 250 v120" stroke="#7c5f33" stroke-width="3"/>
    <rect x="345" y="170" width="100" height="84" rx="8" fill="url(#box)"/>
    <path d="M395 170 v84" stroke="#7c5f33" stroke-width="3"/>
    <!-- low mobile platform -->
    <rect x="280" y="372" width="240" height="70" rx="22" fill="url(#st)"/>
    <rect x="300" y="392" width="200" height="20" rx="8" fill="url(#dk)"/>
    <rect x="300" y="392" width="60" height="20" rx="8" fill="#28d7fb" opacity="0.6" filter="url(#gl)"/>
    <!-- wheels -->
    <circle cx="330" cy="446" r="22" fill="#0d121b" stroke="#28d7fb" stroke-opacity="0.4" stroke-width="4"/>
    <circle cx="470" cy="446" r="22" fill="#0d121b" stroke="#28d7fb" stroke-opacity="0.4" stroke-width="4"/>
    <!-- motion lines -->
    <path d="M250 410 h-60 M250 430 h-90" stroke="#28d7fb" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="400" y="540" text-anchor="middle" font-family="monospace" font-size="13" letter-spacing="5" fill="#28d7fb" opacity="0.7">LOGISTICS ONE</text>
</svg>
