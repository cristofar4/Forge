  <path d="M250 300 q150 -150 300 0 q-150 150 -300 0 z" fill="none" stroke="#9fb1c6" stroke-width="4"/>
  <circle cx="400" cy="300" r="78" fill="none" stroke="#28d7fb" stroke-width="4" filter="url(#gl)"/>
  <circle cx="400" cy="300" r="42" fill="#0a7ea4" opacity="0.5"/>
  <circle cx="400" cy="300" r="20" fill="#8af2ff" filter="url(#gl)"/>
